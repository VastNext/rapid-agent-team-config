[package]
name = "rapid-agent-team-config"
version = "0.1.10"
edition = "2021"
description = "Cross-platform GUI configuration and installation wizard for Rapid Agent Team in OpenCode"
authors = ["VastNext"]
license = "MIT"
repository = "https://github.com/VastNext/rapid-agent-team-config"

[lib]
name = "rapid_agent_team_config"
path = "src/lib.rs"

[[bin]]
name = "RapidAgentTeamConfig"
path = "src/main.rs"

[dependencies]
wry = "0.49"
tao = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"
percent-encoding = "2"
ureq = { version = "2.10", default-features = false, features = ["tls", "socks-proxy", "json"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = { version = "0.10", default-features = false }
png = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.35"
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"

[package.metadata.packager]
product-name = "RapidAgentTeamConfig"
identifier = "com.vastnext.rapid-agent-team-config"
description = "Rapid Agent Team Configuration Tool for OpenCode"
homepage = "https://github.com/VastNext/rapid-agent-team-config"
authors = ["VastNext"]
category = "Utility"
license-file = "LICENSE"
icons = ["assets/icon.png"]
