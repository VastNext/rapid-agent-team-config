name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: RapidAgentTeamConfig.exe
            asset_name: RapidAgentTeamConfig-windows-x64.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: RapidAgentTeamConfig
            asset_name: RapidAgentTeamConfig-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: RapidAgentTeamConfig
            asset_name: RapidAgentTeamConfig-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: RapidAgentTeamConfig
            asset_name: RapidAgentTeamConfig-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js (for frontend checks)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify frontend (HTML/JS static checks)
        run: node tests/verify_frontend.js

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare Windows Artifact
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}")) {
            throw "Target release binary not found!"
          }
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"

      - name: Prepare Unix Artifact
        if: runner.os != 'Windows'
        run: |
          if [ ! -f "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" ]; then
            echo "Target release binary not found!"
            exit 1
          fi
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"
          chmod +x "${{ matrix.asset_name }}"

      - name: Verify Binary Existence and Size
        shell: bash
        run: |
          if [ ! -f "${{ matrix.asset_name }}" ]; then
            echo "::error::Asset ${{ matrix.asset_name }} does not exist!"
            exit 1
          fi
          SIZE=$(wc -c < "${{ matrix.asset_name }}" | tr -d ' ')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Generated artifact ${{ matrix.asset_name }} size: ${SIZE_MB} MB (${SIZE} bytes)"
          if [ "$SIZE_MB" -gt 80 ]; then
            echo "::warning::Artifact size is large (${SIZE_MB} MB > 80 MB). Consider optimizing bundle."
          fi

      - name: Generate SHA256 Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js (for frontend checks)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify frontend
        run: node tests/verify_frontend.js

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev dh-make debhelper

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build Debian package
        run: |
          DEB_VERSION=$(cargo metadata --no-deps --format-version 1 --quiet | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          cargo deb --deb-version "${DEB_VERSION}-1" --output debian/
          echo "DEB_VERSION=${DEB_VERSION}" >> $GITHUB_ENV

      - name: Generate SHA256 checksum
        run: |
          sha256sum debian/rapid-agent-team-config_${{ env.DEB_VERSION }}-1_amd64.deb \
            > debian/rapid-agent-team-config_${{ env.DEB_VERSION }}-1_amd64.deb.sha256

      - name: Upload deb to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            debian/rapid-agent-team-config_${{ env.DEB_VERSION }}-1_amd64.deb
            debian/rapid-agent-team-config_${{ env.DEB_VERSION }}-1_amd64.deb.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
