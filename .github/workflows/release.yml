name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 当前阶段只发布 Windows 版本；其它平台等功能稳定后再恢复。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: RapidAgentTeamConfig.exe
            asset_name: RapidAgentTeamConfig-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js (for frontend checks)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify frontend (HTML/JS static checks)
        run: node tests/verify_frontend.js

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Windows Artifact
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}")) {
            throw "Target release binary not found!"
          }
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"

      - name: Prepare Unix Artifact
        if: runner.os != 'Windows'
        run: |
          if [ ! -f "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" ]; then
            echo "Target release binary not found!"
            exit 1
          fi
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"
          chmod +x "${{ matrix.asset_name }}"

      - name: Verify Binary Existence and Size
        shell: bash
        run: |
          if [ ! -f "${{ matrix.asset_name }}" ]; then
            echo "::error::Asset ${{ matrix.asset_name }} does not exist!"
            exit 1
          fi
          SIZE=$(wc -c < "${{ matrix.asset_name }}" | tr -d ' ')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Generated artifact ${{ matrix.asset_name }} size: ${SIZE_MB} MB (${SIZE} bytes)"
          if [ "$SIZE_MB" -gt 80 ]; then
            echo "::warning::Artifact size is large (${SIZE_MB} MB > 80 MB). Consider optimizing bundle."
          fi

      - name: Generate SHA256 Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
