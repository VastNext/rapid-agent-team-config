name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: RapidAgentTeamConfig-windows-x64.exe
            asset_name: RapidAgentTeamConfig-windows-x64.exe
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: RapidAgentTeamConfig
            asset_name: RapidAgentTeamConfig-linux-x64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: RapidAgentTeamConfig
            asset_name: RapidAgentTeamConfig-macos-arm64
            use_cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: RapidAgentTeamConfig
            asset_name: RapidAgentTeamConfig-macos-x64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Windows Artifact
        if: runner.os == 'Windows'
        run: |
          Copy-Item target/${{ matrix.target }}/release/RapidAgentTeamConfig.exe ${{ matrix.asset_name }}

      - name: Prepare Unix Artifact
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
